name: Sync Resume from Private Repo

on:
  repository_dispatch:
    types: [resume-updated]

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Portfolio
        uses: actions/checkout@v4

      - name: Checkout resume repo
        uses: actions/checkout@v4
        with:
          repository: PSoteropulos/resume
          token: ${{ secrets.RESUME_REPO_READ_TOKEN }}
          path: resume-repo

      - name: Copy resume PDFs into portfolio assets
        run: |
          cp resume-repo/Paul_Soteropulos_Resume_Master.pdf public/assets/docs/Paul_Soteropulos_Resume_Master.pdf
          cp resume-repo/Paul_Soteropulos_Resume_Master_Full.pdf public/assets/docs/Paul_Soteropulos_Resume_Master_Full.pdf
          rm -rf resume-repo

      - name: Open PR with updated resume
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/resume-sync
          title: "Auto: sync resume PDFs"
          commit-message: "Sync resume PDFs (tight + full) from private resume repo"
          body: |
            Automated PR triggered by an update to the private resume repo (`PSoteropulos/resume`).
            Syncs both `Paul_Soteropulos_Resume_Master.pdf` (/resume) and
            `Paul_Soteropulos_Resume_Master_Full.pdf` (/resume-full). Review and merge to redeploy
            the site with the updated resume(s).
          delete-branch: true
