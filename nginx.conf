server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /resume {
        return 302 /assets/docs/Paul_Soteropulos_Resume_Master.pdf;
    }

    # Vite's hashed JS/CSS bundles -- filename changes whenever content changes, safe to cache forever
    location ~* \.(js|css)$ {
        expires 24h;
        add_header Cache-Control "public, immutable";
    }

    # Raw static assets from public/ (images, docs, icons) -- filenames stay the same across edits,
    # so keep this short enough that updates actually show up without a manual cache purge
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
